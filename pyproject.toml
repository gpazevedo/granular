[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "granular"
version = "0.1.0"
description = "Granular Curriculum Knowledge Mapping — Purdue CS"
requires-python = ">=3.11"
dependencies = [
    # Schema
    "pydantic>=2.7",
    # Ingestion
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    # Concept extraction
    "pdfplumber>=0.11",
    "openai>=1.35",
    "psycopg2-binary>=2.9",
    "pgvector>=0.3",
    # Graph store
    "neo4j>=5.21",
    # API
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    # Evaluation
    "scipy>=1.13",
    "typer>=0.12",
    # CLI / config
    "rich>=13.7",
]

[project.scripts]
granular-ingest  = "granular.ingestion.cli:app"
granular-extract = "granular.extraction.cli:app"
granular-infer   = "granular.inference.cli:app"
granular-eval    = "granular.evaluation.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/granular"]

[tool.hatch.envs.default]
dependencies = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",      # for FastAPI TestClient
    "mypy==1.10.1",
    "ruff==0.4.10",
]

[tool.hatch.envs.default.scripts]
test     = "pytest tests/ -v"
typecheck = "mypy src/granular"
lint     = "ruff check src/granular"
fmt      = "ruff format src/granular"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
