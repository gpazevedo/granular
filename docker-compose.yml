version: '3.9'

services:
  neo4j:
    image: neo4j:5.15-community
    container_name: granular-neo4j
    environment:
      NEO4J_AUTH: neo4j/granular-password
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7687:7687"  # Bolt protocol
      - "7474:7474"  # HTTP (browser)
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "granular-password", "RETURN 1"]
      interval: 5s
      timeout: 10s
      retries: 10
    networks:
      - granular-net

  postgres:
    image: pgvector/pgvector:pg16
    container_name: granular-postgres
    environment:
      POSTGRES_DB: granular
      POSTGRES_USER: granular
      POSTGRES_PASSWORD: granular-password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init_pgvector.sql:/docker-entrypoint-initdb.d/init_pgvector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U granular"]
      interval: 5s
      timeout: 10s
      retries: 10
    networks:
      - granular-net

volumes:
  neo4j-data:
  neo4j-logs:
  postgres-data:

networks:
  granular-net:
    driver: bridge
